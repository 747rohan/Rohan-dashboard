version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: worldmonitor-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: worldmonitor-redis-rest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worldmonitor:
    build: ./app
    container_name: worldmonitor
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: worldmonitor_default
    external: true
